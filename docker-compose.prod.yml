services:
  # =================================================================
  # REDIS MESSAGE BROKER
  # =================================================================
  adq_redis:
    image: redis:7-alpine
    container_name: adq_redis
    restart: always
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    networks:
      - adq_internal_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =================================================================
  # OUT-OF-BAND (OAST) INTERACTION SERVER (Exposed on Port 8888)
  # =================================================================
  adq_oast:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: adq_oast
    restart: always
    command: python3 runtime_services.py --role oast --host 0.0.0.0 --port 8888
    ports:
      - "8888:8888" # Public OAST Callback Listener Port
    environment:
      - OAST_PORT=8888
      - LOG_LEVEL=INFO
    networks:
      - adq_internal_net

  # =================================================================
  # FASTAPI BACKEND SERVER (Exposed on Port 8000)
  # =================================================================
  adq_api:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: adq_api
    restart: always
    command: uvicorn api_server:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://adq_redis:6379/0
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
    depends_on:
      adq_redis:
        condition: service_healthy
    networks:
      - adq_internal_net

  # =================================================================
  # DISTRIBUTED MASTER GRID NODE
  # =================================================================
  adq_master:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: adq_master
    restart: always
    command: python3 runtime_services.py --role master
    environment:
      - REDIS_URL=redis://adq_redis:6379/0
    depends_on:
      - adq_redis
    networks:
      - adq_internal_net

  # =================================================================
  # WORKER NODES (Light Recon & Elite Active Scanners)
  # =================================================================
  worker-light:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: worker-light-1
    restart: always
    command: python3 runtime_services.py --role worker --worker-id worker-light-1 --capability light-fast
    environment:
      - WORKER_ID=worker-light-1
      - CAPABILITY=light-fast
      - REDIS_URL=redis://adq_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - adq_master
    networks:
      - adq_internal_net

  worker-elite:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: worker-elite-1
    restart: always
    command: python3 runtime_services.py --role worker --worker-id worker-elite-1 --capability elite-clean-ip
    environment:
      - WORKER_ID=worker-elite-1
      - CAPABILITY=elite-clean-ip
      - REDIS_URL=redis://adq_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
      - OAST_SERVER_URL=http://adq_oast:8888
    depends_on:
      - adq_master
      - adq_oast
    networks:
      - adq_internal_net

  worker-mobile:
    build:
      context: .
      dockerfile: Dockerfile.mobile-worker
    container_name: worker-mobile-1
    restart: always
    command: python3 backend/runtime_services.py --role worker --worker-id worker-mobile-1 --capability mobile-audit
    environment:
      - WORKER_ID=worker-mobile-1
      - CAPABILITY=mobile-audit
      - REDIS_URL=redis://adq_redis:6379/0
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - adq_master
    networks:
      - adq_internal_net

networks:
  adq_internal_net:
    driver: bridge

volumes:
  redis_data:
